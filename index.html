<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 尾牙大抽獎</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: "Microsoft JhengHei", sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }

        /* --- 輻射旋轉背景 --- */
        #sunburst-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 1; pointer-events: none; }
        #sunburst-core { 
            position: absolute; top: 50%; left: 50%; width: 500vmax; height: 500vmax; 
            transform: translate(-50%, -50%); 
            background: conic-gradient(from 0deg, #ffd700 0deg 15deg, transparent 15deg 30deg); 
            z-index: 2;
            animation: rotateSun 15s linear infinite, flashSun 0.5s ease-in-out infinite alternate;
        }
        @keyframes rotateSun { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes flashSun { from { opacity: 0.1; } to { opacity: 0.5; } }

        /* 標題與介面 */
        #header-title { position: fixed; top: 30px; width: 100%; text-align: center; font-size: 32px; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.8); z-index: 100; font-weight: bold; }
        #status { position: fixed; top: 10px; right: 15px; color: #888; z-index: 100; font-size: 16px; }

        /* 三行顯示內容 */
        #display-box { text-align: center; z-index: 50; width: 100%; display: flex; flex-direction: column; gap: 10px; }
        #name-id { font-size: 35px; color: #888; margin: 0; letter-spacing: 2px; }
        #name-ch { font-size: 100px; font-weight: bold; margin: 0; color: #fff; text-shadow: 2px 2px 10px #000; }
        #name-vn { font-size: 50px; font-style: italic; color: #4da6ff; margin: 0; text-shadow: 2px 2px 10px #000; }

        /* 頒獎層 */
        #award-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 80; }
        #award-msg { font-size: 70px; font-weight: bold; color: #ff3333; text-shadow: 0 0 20px #fff; text-align: center; }

        #canvas-fire { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        @media (max-width: 600px) {
            #name-ch { font-size: 65px; }
            #name-vn { font-size: 32px; }
            #header-title { font-size: 24px; }
        }
    </style>
</head>
