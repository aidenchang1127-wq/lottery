<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 尾牙大抽獎 - 整備課專用</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: "Microsoft JhengHei", sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }

        /* --- 輻射旋轉背景 (強制顯示版) --- */
        #sunburst-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            display: none; z-index: 1; pointer-events: none; 
        }
        #sunburst-core { 
            position: absolute; top: 50%; left: 50%; width: 500vmax; height: 500vmax; 
            transform: translate(-50%, -50%); 
            background: conic-gradient(from 0deg, #ffd700 0deg 15deg, transparent 15deg 30deg); 
            z-index: 2;
            animation: rotateSun 15s linear infinite, flashSun 0.5s ease-in-out infinite alternate;
        }
        @keyframes rotateSun { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes flashSun { from { opacity: 0.1; } to { opacity: 0.5; } }

        /* 標題與狀態 */
        #header-title { position: fixed; top: 30px; width: 100%; text-align: center; font-size: 32px; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.8); z-index: 100; font-weight: bold; }
        #status { position: fixed; top: 10px; right: 15px; color: #888; z-index: 100; font-size: 16px; }

        /* 三行顯示區塊 */
        #display-box { text-align: center; z-index: 50; width: 100%; display: flex; flex-direction: column; gap: 10px; }
        #name-id { font-size: 40px; color: #888; margin: 0; letter-spacing: 2px; } /* 工號 */
        #name-ch { font-size: 100px; font-weight: bold; margin: 0; color: #fff; text-shadow: 2px 2px 10px #000; } /* 中文名 */
        #name-vn { font-size: 55px; font-style: italic; color: #4da6ff; margin: 0; text-shadow: 2px 2px 10px #000; } /* 越文名 */

        /* 頒獎層 */
        #award-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 80; }
        #award-msg { font-size: 70px; font-weight: bold; color: #ff3333; text-shadow: 0 0 20px #fff; text-align: center; line-height: 1.3; }

        #canvas-fire { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .winning-zoom { animation: pulse 0.6s infinite; color: #ffd700 !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body onclick="activateSystem()">

    <div id="sunburst-overlay"><div id="sunburst-core"></div></div>
    <canvas id="canvas-fire"></canvas>
    
    <div id="status">剩餘人數: <span id="count">--</span></div>
    <div id="header-title">🎊 2026 YEAR-END PARTY 🎊</div>

    <div id="display-box">
        <div id="name-id" style="color:#ffd700">READY</div>
        <div id="name-ch">點擊螢幕啟動</div>
        <div id="name-vn">Bấm để bắt đầu</div>
    </div>

    <div id="award-overlay">
        <div id="award-msg">恭喜中獎！<br><span style="font-size: 40px; color: gold;">Chúc Mừng Trúng Giải!</span></div>
    </div>

    <audio id="snd-drum" src="drum.mp3" loop></audio>
    <audio id="snd-gong" src="gong.mp3"></audio>
    <audio id="snd-award"></audio>

<script>
    // 直接內置最新名單，防止本地讀取 txt 失敗
    const rawData = `VNW0000434,阮春決,NGUYỄN XUÂN QUYẾT
VNW0003475,阮德勇,NGUYỄN ĐỨC DŨNG
VNW0004172,阮志青,NGUYỄN CHÍ THANH
VNW0004182,黎越龍,LÊ VIỆT LONG
VNW0005167,阮文南,NGUYỄN VĂN NAM
VNW0005775,范誠江,PHẠM THÀNH GIANG
VNW0008908,胡仲捷,HỒ TRỌNG TIẾP
VNW0011643,段英俊,ĐOÀN ANH TUẤN
VNW0008906,阮裴創,NGUYỄN BÙI SANG
VNW0008929,阮文俠,NGUYỄN VĂN HIỆP
VNW0009048,阮文數,NGUYỄN VĂN TOÁN
VNW0009112,梅懷南,MAI HOÀI NAM
VNW0009713,張功定,TRƯƠNG CÔNG ĐỊNH
VNW0009901,阮友當,NGUYỄN HỮU ĐANG
VNW0010878,黎文三,LÊ VĂV TAM
VNW0011023,阮文山,NGUYỄN VĂN SƠN
VNW0011044,胡文明,HỒ VĂN MINH
VNW0011353,黎文頓,LÊ VĂN ĐỐN
VNW0011363,陳世龍,TRẦN THẾ LỘNG
VNW0011846,段文龍,ĐOÀN VAV LONG
VNW0012529,黎文芳,LÊ VĂN PHƯƠNG
VNW0012530,阮嘉陽,NGUYỄN GIA DƯƠNG
VNW0012532,張光雄,TRƯƠNG QUANG HÙNG
VNW0013656,黎德壽,LÊ ĐỨC THỌ
VNW0014782,阮文德,NGUYỄN VĂN ĐỨC
VNW0015087,范泰陽,PHẠM THÁI DƯƠNG
VNW0015093,范方南,PHẠM PHƯƠNG NAM
VNW0015465,阮明創,NGUYỄN MINH SANG
VNW0015719,阮庭決,NGUYỄN ĐÌNH QUYẾT
VNW0015720,陳友俊,TRẦN HỮU TUẤN
VNW0015794,阮文泰,NGUYỄN VĂN THÁI
VNW0016190,留光靈,LƯU QUANG LINH
VNW0016191,黎曰德,LÊ VIẾT ĐỨC
VNW0016300,阮文頭,NGUYỄN VĂN ĐẦU
VNW0016332,林青心,LÂM THANH TÂM
VNW0016333,范國越,PHẠM QUỐC VIỆT
VNW0016542,允文子,DOÃN VĂN TÝ
VNW0016915,潘友功,PHAN HỮU CÔNG
VNW0019196,武文源,VÕ VĂN NGUYÊN
VNW0000478,黎玉俊英,LÊ NGỌC TUẤN ANH`;

    let list = JSON.parse(localStorage.getItem('lotteryList')) || rawData.split('\n').map(line => line.trim());
    let isRolling = false, activated = false, lastIdx = -1, isFire = false;
    const awards = ['award1.mp3', 'award2.mp3', 'award3.mp3'];

    const idEl = document.getElementById('name-id'), chEl = document.getElementById('name-ch'), vnEl = document.getElementById('name-vn');
    const cntEl = document.getElementById('count'), awardUI = document.getElementById('award-overlay'), sun = document.getElementById('sunburst-overlay');

    function activateSystem() {
        if (!activated) {
            activated = true;
            cntEl.innerText = list.length;
            idEl.innerText = "READY";
            chEl.innerText = "準備抽獎"; vnEl.innerText = "Sẵn sàng";
            chEl.style.color = "#fff";
            document.getElementById('snd-drum').play().then(() => document.getElementById('snd-drum').pause());
        }
    }

    function toggleAward() {
        if (isRolling || !activated) return; 
        const audAward = document.getElementById('snd-award');
        if (audAward.paused) {
            audAward.src = awards[Math.floor(Math.random() * awards.length)];
            audAward.play().catch(()=>{});
            document.getElementById('display-box').style.visibility = 'hidden'; 
            awardUI.style.display = 'flex'; 
            sun.style.display = 'block'; 
        } else {
            audAward.pause();
            document.getElementById('display-box').style.visibility = 'visible'; 
            awardUI.style.display = 'none'; 
            sun.style.display = 'none';
        }
    }

    function handleDraw() {
        if (!activated || list.length === 0 || awardUI.style.display === 'flex') return;
        if (!isRolling) {
            isRolling = true; isFire = false;
            document.getElementById('snd-drum').play().catch(()=>{});
            timer = setInterval(() => {
                lastIdx = Math.floor(Math.random() * list.length);
                const [vid, vch, vvn] = list[lastIdx].split(',');
                idEl.innerText = vid; chEl.innerText = vch; vnEl.innerText = vvn;
                chEl.style.color = ['#ff4d4d', '#ffd700', '#4dff4d', '#00ffff'][Math.floor(Math.random()*4)];
            }, 60);
        } else {
            isRolling = false; clearInterval(timer);
            document.getElementById('snd-drum').pause();
            document.getElementById('snd-gong').play().catch(()=>{});
            isFire = true; chEl.style.color = '#ffd700'; vnEl.style.color = '#ffd700';
            setTimeout(() => {
                const [vid, vch] = list[lastIdx].split(',');
                if (confirm(`🎉 恭喜中獎: ${vch} (${vid})\n是否移除？`)) {
                    list.splice(lastIdx, 1);
                    localStorage.setItem('lotteryList', JSON.stringify(list));
                    cntEl.innerText = list.length;
                    idEl.innerText = "NEXT"; chEl.innerText = "準備抽獎"; vnEl.innerText = "Sẵn sàng";
                    chEl.style.color = "white"; isFire = false;
                }
            }, 800);
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); handleDraw(); }
        if (e.code === 'Enter') { e.preventDefault(); toggleAward(); }
    });

    const canv = document.getElementById('canvas-fire'), ctx = canv.getContext('2d');
    let parts = [];
    canv.width = window.innerWidth; canv.height = window.innerHeight;
    function anim() {
        requestAnimationFrame(anim);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,canv.width,canv.height);
        if (isFire && Math.random() < 0.05) {
            const x = Math.random()*canv.width, y = Math.random()*canv.height*0.4, col = `hsl(${Math.random()*360},100%,60%)`;
            for(let i=0; i<30; i++) parts.push({x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,a:1,col});
        }
        parts.forEach((p,i) => {
            p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.a-=0.012;
            if(p.a>0) { ctx.globalAlpha=p.a; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fillStyle=p.col; ctx.fill(); }
            else parts.splice(i,1);
        });
    }
    anim();
</script>
</body>
</html>
