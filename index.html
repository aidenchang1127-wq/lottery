<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 尾牙大抽獎</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: "Microsoft JhengHei", sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }

        /* 輻射旋轉背景 */
        #sunburst-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 1; pointer-events: none; }
        #sunburst-core { position: absolute; top: 50%; left: 50%; width: 400vmax; height: 400vmax; transform: translate(-50%, -50%); background: conic-gradient(from 0deg, rgba(255, 215, 0, 0.8) 0deg 15deg, transparent 15deg 30deg); animation: rotateSun 15s linear infinite, flashSun 0.4s ease-in-out infinite alternate; }
        @keyframes rotateSun { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes flashSun { from { opacity: 0.1; } to { opacity: 0.5; } }

        #header-title { position: fixed; top: 30px; width: 100%; text-align: center; font-size: 32px; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.8); z-index: 100; font-weight: bold; }
        #status { position: fixed; top: 10px; right: 15px; color: #888; z-index: 100; font-size: 16px; }

        #display-box { text-align: center; z-index: 50; width: 100%; }
        #name-ch { font-size: 80px; font-weight: bold; margin: 0; color: #fff; }
        #name-vn { font-size: 40px; font-style: italic; color: #4da6ff; margin-top: 15px; }

        #award-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 80; }
        #award-msg { font-size: 60px; font-weight: bold; color: #ff3333; text-shadow: 0 0 20px #fff; text-align: center; }

        #canvas-fire { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
    </style>
</head>
<body id="mainBody">

    <div id="sunburst-overlay"><div id="sunburst-core"></div></div>
    <canvas id="canvas-fire"></canvas>
    
    <div id="status">剩餘人數: <span id="count">--</span></div>
    <div id="header-title">🎊 2026 YEAR-END PARTY 🎊</div>

    <div id="display-box">
        <div id="name-ch" style="color:#ffd700">載入中...</div>
        <div id="name-vn">Loading</div>
    </div>

    <div id="award-overlay">
        <div id="award-msg">恭喜中獎！<br><span style="font-size: 36px; color: gold;">Chúc Mừng Trúng Giải!</span></div>
    </div>

    <audio id="snd-drum" src="DRUM.mp3" loop></audio>
    <audio id="snd-gong" src="Gong.mp3"></audio>
    <audio id="snd-award"></audio>

<script>
    let list = [];
    let isRolling = false, activated = false, lastIdx = -1, pressTimer;
    const awards = ['award1.mp3', 'award2.mp3', 'award3.mp3'];

    const ch = document.getElementById('name-ch'), vn = document.getElementById('name-vn'), cnt = document.getElementById('count');
    const awardUI = document.getElementById('award-overlay'), sun = document.getElementById('sunburst-overlay');
    const audDrum = document.getElementById('snd-drum'), audGong = document.getElementById('snd-gong'), audAward = document.getElementById('snd-award');

    // 載入名單
    async function initList() {
        try {
            const res = await fetch('names.txt');
            const text = await res.text();
            list = text.split('\n').map(l => l.trim()).filter(l => l !== "");
            cnt.innerText = list.length;
            ch.innerText = "點擊螢幕開始"; vn.innerText = "Bấm để bắt đầu";
        } catch (e) { ch.innerText = "讀取失敗"; }
    }

    function toggleAward() {
        if (isRolling) return; 
        if (audAward.paused) {
            audAward.src = awards[Math.floor(Math.random() * awards.length)];
            audAward.play().catch(()=>{});
            document.getElementById('display-box').style.visibility = 'hidden';
            awardUI.style.display = 'flex'; sun.style.display = 'block';
        } else {
            audAward.pause();
            document.getElementById('display-box').style.visibility = 'visible';
            awardUI.style.display = 'none'; sun.style.display = 'none';
        }
    }

    function handleDraw() {
        if (list.length === 0 || awardUI.style.display === 'flex') return;
        if (!isRolling) {
            isRolling = true;
            audDrum.play().catch(()=>{});
            timer = setInterval(() => {
                lastIdx = Math.floor(Math.random() * list.length);
                const [nch, nvn] = list[lastIdx].split(',');
                ch.innerText = nch; vn.innerText = nvn || "";
                ch.style.color = ['#ff4d4d', '#ffd700', '#4dff4d', '#00ffff'][Math.floor(Math.random()*4)];
            }, 60);
        } else {
            isRolling = false; clearInterval(timer);
            audDrum.pause(); audGong.play().catch(()=>{});
            ch.style.color = '#ffd700'; vn.style.color = '#ffd700';
            setTimeout(() => {
                if (confirm(`恭喜: ${list[lastIdx].split(',')[0]}\n移除？`)) {
                    list.splice(lastIdx, 1);
                    cnt.innerText = list.length;
                    ch.innerText = "點擊再抽"; vn.innerText = "Bấm để tiếp tục";
                }
            }, 500);
        }
    }

    // 觸控邏輯
    const body = document.getElementById('mainBody');
    body.addEventListener('touchstart', (e) => {
        pressTimer = window.setTimeout(toggleAward, 1000); // 長按 1 秒頒獎
    });
    body.addEventListener('touchend', (e) => {
        clearTimeout(pressTimer);
    });
    body.addEventListener('click', () => {
        if (!activated) {
            activated = true; activateAudio();
            ch.innerText = "準備抽獎"; vn.innerText = "Sẵn sàng";
        } else {
            handleDraw();
        }
    });

    function activateAudio() {
        // 解決手機音效權限
        audDrum.play().then(() => audDrum.pause());
        audGong.play().then(() => audGong.pause());
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handleDraw();
        if (e.code === 'Enter') toggleAward();
    });

    initList();
</script>
</body>
</html>
