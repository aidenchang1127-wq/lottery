<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 尾牙大抽獎 - 整備課強化版</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: "Microsoft JhengHei", sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }

        /* --- 1. 背景金光放射層 (與圖片一致的放射效果) --- */
        #sunburst-overlay {
            position: fixed; top: 50%; left: 50%; width: 600vmax; height: 600vmax; 
            transform: translate(-50%, -50%);
            /* 10道強力放射金光 */
            background: repeating-conic-gradient(
                #ffd700 0deg 18deg, 
                transparent 18deg 36deg
            );
            z-index: 1;
            display: none; /* 預設關閉，頒獎音樂啟動後才開啟 */
            animation: rotateSun 15s linear infinite;
            filter: blur(2px); /* 增加一點發光感 */
        }
        @keyframes rotateSun { 
            from { transform: translate(-50%, -50%) rotate(0deg); } 
            to { transform: translate(-50%, -50%) rotate(360deg); } 
        }

        /* 畫布層：煙火專用 */
        #fire-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* 頂部標題與狀態 */
        #header-title { position: fixed; top: 40px; width: 100%; text-align: center; font-size: 55px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.8); z-index: 100; font-weight: bold; }
        #status { position: fixed; top: 20px; right: 30px; color: #888; z-index: 100; font-size: 24px; }

        /* 抽獎主顯示區 (三行) */
        #display-box { text-align: center; z-index: 50; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        #name-id { font-size: 45px; color: #666; letter-spacing: 5px; margin: 0; }
        #name-ch { font-size: 160px; font-weight: bold; margin: 0; color: #fff; text-shadow: 2px 2px 15px #000; }
        #name-vn { font-size: 85px; font-style: italic; color: #4da6ff; margin: 0; text-shadow: 2px 2px 15px #000; }

        /* 頒獎層 */
        #award-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 80;
        }
        #award-msg { font-size: 130px; font-weight: bold; color: #ff3333; text-shadow: 0 0 30px #fff, 0 0 60px #ff3333; text-align: center; line-height: 1.2; z-index: 90; }

        .winning-zoom { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body onclick="activateSystem()">

    <div id="sunburst-overlay"></div>
    
    <canvas id="fire-canvas"></canvas>
    
    <div id="status">剩餘人數: <span id="count">--</span></div>
    <div id="header-title">🎊 2026 YEAR-END PARTY 🎊</div>

    <div id="display-box">
        <div id="name-id" style="color: #ffd700;">READY</div>
        <div id="name-ch">點擊螢幕啟動</div>
        <div id="name-vn">Bấm để bắt đầu</div>
    </div>

    <div id="award-overlay">
        <div id="award-msg">恭喜中獎！<br><span style="font-size: 75px; color: gold;">Chúc Mừng Trúng Giải!</span></div>
    </div>

    <audio id="snd-drum" src="drum.mp3" loop></audio>
    <audio id="snd-gong" src="gong.mp3"></audio>
    <audio id="snd-award"></audio>

<script>
    // 內建人員名單 
    const rawData = `VNW0000434,阮春決,NGUYỄN XUÂN QUYẾT
VNW0003475,阮德勇,NGUYỄN ĐỨC DŨNG
VNW0004172,阮志青,NGUYỄN CHÍ THANH
VNW0004182,黎越龍,LÊ VIỆT LONG
VNW0005167,阮文南,NGUYỄN VĂN NAM
VNW0005775,范誠江,PHẠM THÀNH GIANG
VNW0008908,胡仲捷,HỒ TRỌNG TIẾP
VNW0011643,段英俊,ĐOÀN ANH TUẤN
VNW0008906,阮裴創,NGUYỄN BÙI SANG
VNW0008929,阮文俠,NGUYỄN VĂN HIỆP
VNW0009048,阮文數,NGUYỄN VĂN TOÁN
VNW0009112,梅懷南,MAI HOÀİ NAM
VNW0009713,張功定,TRƯƠNG CÔNG ĐỊNH
VNW0009901,阮友當,NGUYỄN HỮU ĐANG
VNW0010878,黎文三,LÊ VĂN TAM
VNW0011023,阮文山,NGUYỄN VĂN SƠN
VNW0011044,胡文明,HỒ VĂN MINH
VNW0011353,黎文頓,LÊ VĂN ĐỐN
VNW0011363,陳世龍,TRẦN THẾ LỘNG
VNW0011846,段文龍,ĐOÀN VĂN LONG
VNW0012529,黎文芳,LÊ VĂN PHƯƠNG
VNW0012530,阮嘉陽,NGUYỄN GIA DƯƠNG
VNW0012532,張光雄,TRƯƠNG QUANG HÙNG
VNW0013656,黎德壽,LÊ ĐỨC THỌ
VNW0014782,阮文德,NGUYỄN VĂN ĐỨC
VNW0015087,范泰陽,PHẠM THÁI DƯƠNG
VNW0015093,范方南,PHẠM PHƯƠNG NAM
VNW0015465,阮明創,NGUYỄN MINH SANG
VNW0015719,阮庭決,NGUYỄN ĐÌNH QUYẾT
VNW0015720,陳友俊,TRẦN HỮU TUẤN
VNW0015794,阮文泰,NGUYỄN VĂN THÁI
VNW0016190,留光靈,LƯU QUANG LINH
VNW0016191,黎曰德,LÊ VIẾT ĐỨC
VNW0016300,阮文頭,NGUYỄN VĂN ĐẦU
VNW0016332,林青心,LÂM THANH TÂM
VNW0016333,范國越,PHẠM QUỐC VIỆT
VNW0016542,允文子,DOÃN VĂN TÝ
VNW0016915,潘友功,PHAN HỮU CÔNG
VNW0019196,武文源,VÕ VĂN NGUYÊN
VNW0000478,黎玉俊英,LÊ NGỌC TUẤN ANH`;

    let list = JSON.parse(localStorage.getItem('lotteryList')) || rawData.split('\n').map(l => l.trim());
    let isRolling = false, activated = false, lastIdx = -1, isFire = false;
    const awards = ['award1.mp3', 'award2.mp3', 'award3.mp3'];

    const idEl = document.getElementById('name-id'), chEl = document.getElementById('name-ch'), vnEl = document.getElementById('name-vn'), cntEl = document.getElementById('count');
    const awardUI = document.getElementById('award-overlay'), box = document.getElementById('display-box'), sun = document.getElementById('sunburst-overlay');

    // --- 煙火畫布與清空邏輯 ---
    const canv = document.getElementById('fire-canvas'), ctx = canv.getContext('2d');
    let parts = [];

    function resize() { canv.width = window.innerWidth; canv.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function drawFX() {
        // 使用半透明黑色填充來清除，達到「拖尾」並最終消失的效果
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
        ctx.fillRect(0, 0, canv.width, canv.height);

        if (isFire || parts.length > 0) {
            if (isFire && Math.random() < 0.25) { 
                const x = Math.random()*canv.width, y = Math.random()*canv.height*0.5, col = `hsl(${Math.random()*360},100%,60%)`;
                for(let i=0; i<80; i++) parts.push({x,y,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,a:1,col});
            }
            parts.forEach((p,i) => {
                p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.a-=0.015; // 加快消失速度
                if(p.a>0) { 
                    ctx.globalAlpha=p.a; ctx.beginPath(); ctx.arc(p.x,p.y,4.5,0,Math.PI*2); ctx.fillStyle=p.col; ctx.fill(); 
                } else {
                    parts.splice(i,1);
                }
            });
            ctx.globalAlpha = 1;
        }
        requestAnimationFrame(drawFX);
    }
    drawFX();

    function activateSystem() {
        if (!activated) {
            activated = true;
            cntEl.innerText = list.length;
            chEl.innerText = "準備抽獎"; vnEl.innerText = "Sẵn sàng";
            chEl.style.color = "#fff";
        }
    }

    function toggleAward() {
        if (isRolling || !activated) return; 
        const audAward = document.getElementById('snd-award');
        if (audAward.paused) {
            audAward.src = awards[Math.floor(Math.random() * awards.length)];
            audAward.play().catch(()=>{});
            box.style.visibility = 'hidden'; 
            awardUI.style.display = 'flex';
            sun.style.display = 'block'; // 顯示 10 道金光
        } else {
            audAward.pause();
            box.style.visibility = 'visible'; 
            awardUI.style.display = 'none';
            sun.style.display = 'none'; // 隱藏 10 道金光
        }
    }

    function handleDraw() {
        if (!activated || list.length === 0 || awardUI.style.display === 'flex') return;
        if (!isRolling) {
            isRolling = true; isFire = false;
            box.classList.remove('winning-zoom');
            document.getElementById('snd-drum').play().catch(()=>{});
            timer = setInterval(() => {
                lastIdx = Math.floor(Math.random() * list.length);
                const [vid, vch, vvn] = list[lastIdx].split(',');
                idEl.innerText = vid; chEl.innerText = vch; vnEl.innerText = vvn;
                chEl.style.color = ['#ff4d4d', '#ffd700', '#4dff4d', '#00ffff'][Math.floor(Math.random()*4)];
            }, 60);
        } else {
            isRolling = false; clearInterval(timer);
            document.getElementById('snd-drum').pause();
            document.getElementById('snd-gong').play().catch(()=>{});
            isFire = true; chEl.style.color = '#ffd700'; vnEl.style.color = '#ffd700'; box.classList.add('winning-zoom');
            setTimeout(() => {
                const [vid, vch] = list[lastIdx].split(',');
                if (confirm(`🎉 恭喜中獎: ${vch} (${vid})\n是否移除？`)) {
                    list.splice(lastIdx, 1);
                    localStorage.setItem('lotteryList', JSON.stringify(list));
                    cntEl.innerText = list.length;
                    idEl.innerText = "NEXT"; chEl.innerText = "準備抽獎"; vnEl.innerText = "Sẵn sàng";
                    chEl.style.color = "white"; 
                    isFire = false; // 中獎確認後停止噴發
                    box.classList.remove('winning-zoom');
                } else {
                    isFire = false;
                    box.classList.remove('winning-zoom');
                }
            }, 800);
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); handleDraw(); }
        if (e.code === 'Enter') { e.preventDefault(); toggleAward(); }
    });
</script>
</body>
</html>
